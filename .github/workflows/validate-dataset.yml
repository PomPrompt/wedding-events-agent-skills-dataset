name: Validate discovery dataset
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Offline data and mirror checks
        run: python scripts/validate_dataset.py
